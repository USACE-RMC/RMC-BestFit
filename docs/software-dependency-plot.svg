<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">RMC Software Dependency and Interoperability Architecture</title>
  <desc id="desc">The Dam Screening Tool calls RMC TotalRisk, SystemResponse, and LifeSim. RMC BestFit, RMC TotalRisk, RMC RFA, SystemResponse, and LifeSim use Numerics.dll as their sole model dependency and exchange data through Numerics interfaces. HEC-SSP and HEC-FDA are shown as potential Numerics adopters.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f2742" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#395a78"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#087e8b"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #526b80; }
      .layer { fill: #f7f9fc; stroke: #c9d5e2; stroke-width: 2; }
      .layer-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #526b80; letter-spacing: 1.2px; }
      .node-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #102a43; }
      .node-sub { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .node-app { fill: #e8f1fb; stroke: #3477b7; stroke-width: 2.5; }
      .node-api { fill: #ffffff; stroke: #7f9bb4; stroke-width: 2; }
      .node-hec { fill: #fbfbfc; stroke: #8a94a3; stroke-width: 2; stroke-dasharray: 9 7; }
      .node-contract { fill: #dff5f2; stroke: #087e8b; stroke-width: 3; }
      .node-primitive { fill: #eef9f7; stroke: #4da7a9; stroke-width: 2; }
      .edge { fill: none; stroke: #395a78; stroke-width: 3; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #087e8b; stroke-width: 3; marker-end: url(#arrow-teal); }
      .candidate { fill: none; stroke: #788896; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .edge-label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #334e68; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .note { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #087e8b; }
      .legend { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #526b80; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">RMC Software Dependency and Interoperability Architecture</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">Numerics.dll is the shared model foundation and data-exchange contract</text>

  <!-- Application layer -->
  <rect x="40" y="110" width="1720" height="170" rx="18" class="layer"/>
  <text x="70" y="145" class="layer-title">APPLICATION LAYER</text>
  <rect x="665" y="165" width="470" height="80" rx="14" class="node-app" filter="url(#shadow)"/>
  <text x="900" y="198" text-anchor="middle" class="node-title">Dam Screening Tool (DST)</text>
  <text x="900" y="226" text-anchor="middle" class="node-sub">Orchestrates risk, system-response, and life-loss APIs</text>

  <!-- Domain API layer -->
  <rect x="40" y="315" width="1720" height="270" rx="18" class="layer"/>
  <text x="70" y="350" class="layer-title">RMC DOMAIN-MODEL APIs</text>

  <g filter="url(#shadow)">
    <rect x="70" y="395" width="280" height="112" rx="14" class="node-api"/>
    <rect x="415" y="395" width="280" height="112" rx="14" class="node-api"/>
    <rect x="760" y="395" width="280" height="112" rx="14" class="node-api"/>
    <rect x="1105" y="395" width="280" height="112" rx="14" class="node-api"/>
    <rect x="1450" y="395" width="280" height="112" rx="14" class="node-api"/>
  </g>

  <text x="210" y="437" text-anchor="middle" class="node-title">RMC.BestFit.dll</text>
  <text x="210" y="468" text-anchor="middle" class="node-sub">Hazard estimation</text>

  <text x="555" y="437" text-anchor="middle" class="node-title">RMC.TotalRisk.dll</text>
  <text x="555" y="468" text-anchor="middle" class="node-sub">Risk computation</text>

  <text x="900" y="437" text-anchor="middle" class="node-title">RMC.RFA.dll</text>
  <text x="900" y="468" text-anchor="middle" class="node-sub">Regional frequency analysis</text>

  <text x="1245" y="437" text-anchor="middle" class="node-title">SystemResponse.dll</text>
  <text x="1245" y="468" text-anchor="middle" class="node-sub">System-response functions</text>

  <text x="1590" y="437" text-anchor="middle" class="node-title">LifeSim API</text>
  <text x="1590" y="468" text-anchor="middle" class="node-sub">Life-loss and consequence simulation</text>

  <!-- DST API calls -->
  <path d="M825 245 C760 300, 650 326, 555 395" class="edge"/>
  <text x="643" y="310" text-anchor="middle" class="edge-label">Risk-computation API</text>

  <path d="M975 245 C1045 300, 1155 326, 1245 395" class="edge"/>
  <text x="1155" y="310" text-anchor="middle" class="edge-label">System-response API</text>

  <path d="M1045 245 C1260 286, 1460 318, 1590 395" class="edge"/>
  <text x="1438" y="300" text-anchor="middle" class="edge-label">LifeSim API</text>

  <!-- Candidate adopters -->
  <rect x="40" y="625" width="440" height="310" rx="18" class="layer"/>
  <text x="70" y="660" class="layer-title">POTENTIAL NUMERICS ADOPTERS</text>
  <rect x="75" y="700" width="165" height="82" rx="14" class="node-hec"/>
  <rect x="280" y="700" width="165" height="82" rx="14" class="node-hec"/>
  <text x="157.5" y="750" text-anchor="middle" class="node-title">HEC-SSP</text>
  <text x="362.5" y="750" text-anchor="middle" class="node-title">HEC-FDA</text>
  <text x="260" y="845" text-anchor="middle" class="node-sub">A Numerics reference would provide the same</text>
  <text x="260" y="871" text-anchor="middle" class="node-sub">shared interfaces and interoperability benefits</text>

  <!-- Shared Numerics layer -->
  <rect x="535" y="625" width="1225" height="385" rx="18" fill="#f3fbfa" stroke="#77bebd" stroke-width="2.5"/>
  <text x="570" y="660" class="layer-title">NUMERICS.DLL — SHARED MODEL AND INTEROPERABILITY LAYER</text>

  <rect x="625" y="710" width="1045" height="105" rx="16" class="node-contract" filter="url(#shadow)"/>
  <text x="1147.5" y="751" text-anchor="middle" class="node-title">Shared interfaces and transferable data types</text>
  <text x="1147.5" y="783" text-anchor="middle" class="node-sub">Common contract for passing models, observations, functions, and uncertainty</text>

  <path d="M1147.5 815 L1147.5 855" class="dependency"/>

  <rect x="625" y="865" width="1045" height="92" rx="16" class="node-primitive"/>
  <text x="1147.5" y="904" text-anchor="middle" class="node-title">Numerical and probabilistic primitives</text>
  <text x="1147.5" y="936" text-anchor="middle" class="node-sub">Data objects • distributions • functions • sampling • copulas • ParameterSet ensembles</text>

  <!-- Current sole model dependencies -->
  <path d="M210 507 C210 600, 720 635, 720 710" class="dependency"/>
  <path d="M555 507 C555 600, 850 635, 850 710" class="dependency"/>
  <path d="M900 507 L900 710" class="dependency"/>
  <path d="M1245 507 C1245 600, 1200 635, 1200 710" class="dependency"/>
  <path d="M1590 507 C1590 600, 1490 635, 1490 710" class="dependency"/>
  <text x="1115" y="610" text-anchor="middle" class="note">Sole model dependency for every RMC domain API</text>

  <!-- Proposed dependencies -->
  <path d="M157.5 782 C180 900, 460 870, 625 770" class="candidate"/>
  <path d="M362.5 782 C410 845, 500 825, 625 785" class="candidate"/>

  <!-- Legend -->
  <line x1="65" y1="1045" x2="125" y2="1045" class="dependency"/>
  <text x="140" y="1051" class="legend">Current sole model dependency</text>
  <line x1="425" y1="1045" x2="485" y2="1045" class="candidate"/>
  <text x="500" y="1051" class="legend">Proposed Numerics integration</text>
  <line x1="775" y1="1045" x2="835" y2="1045" class="edge"/>
  <text x="850" y="1051" class="legend">Application-to-domain API call</text>
</svg>
