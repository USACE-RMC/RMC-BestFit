<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title description">
  <title id="title">Passed verification cells by analysis area</title>
  <desc id="description">Horizontal bars follow the application order and show 17 distribution fitting cells, 10 point-process cells, 18 competing-risk cells, 6 mixture cells, 12 composite cells, 23 bivariate and coincident-frequency cells, 36 rating-curve cells, 49 time-series cells, and 30 spatial-extremes cells.</desc>
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="30" y="38" fill="#15324b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Passed verification cells by analysis area</text>
  <text x="30" y="64" fill="#60717f" font-family="Arial, sans-serif" font-size="14">Accepted oracle and recovery evidence at the documented checkpoint</text>
  <line x1="260" y1="90" x2="260" y2="555" stroke="#9aaeba" stroke-width="1"/>
  <line x1="400" y1="90" x2="400" y2="555" stroke="#d6e0e6" stroke-width="1"/>
  <line x1="540" y1="90" x2="540" y2="555" stroke="#d6e0e6" stroke-width="1"/>
  <line x1="680" y1="90" x2="680" y2="555" stroke="#d6e0e6" stroke-width="1"/>
  <line x1="820" y1="90" x2="820" y2="555" stroke="#d6e0e6" stroke-width="1"/>
  <line x1="960" y1="90" x2="960" y2="555" stroke="#d6e0e6" stroke-width="1"/>
  <g fill="#60717f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="260" y="579">0</text><text x="400" y="579">10</text><text x="540" y="579">20</text><text x="680" y="579">30</text><text x="820" y="579">40</text><text x="960" y="579">50</text>
  </g>
