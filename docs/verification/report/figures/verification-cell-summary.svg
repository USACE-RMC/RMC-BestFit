    <rect x="260" y="152" width="140" height="30" rx="3"/>
    <rect x="260" y="204" width="252" height="30" rx="3"/>
    <rect x="260" y="256" width="84" height="30" rx="3"/>
    <rect x="260" y="308" width="168" height="30" rx="3"/>
    <rect x="260" y="360" width="322" height="30" rx="3"/>
    <rect x="260" y="412" width="504" height="30" rx="3"/>
