    <text x="245" y="122">Distribution fitting</text>
    <text x="245" y="174">Point process</text>
    <text x="245" y="226">Competing risks</text>
    <text x="245" y="278">Mixture</text>
    <text x="245" y="330">Composite</text>
    <text x="245" y="382">Bivariate / coincident</text>
    <text x="245" y="434">Rating curve</text>
    <text x="245" y="486">Time series</text>
    <text x="245" y="538">Spatial extremes</text>
  </g>
