name: Integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  model-library:
    name: Model library
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $ignoredTracked = @(git ls-files -ci --exclude-standard)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect tracked files.' }
          if ($ignoredTracked.Count -gt 0) {
            throw ("Tracked files match .gitignore rules:`n" + ($ignoredTracked -join "`n"))
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RMC.BestFit.Tests/RMC.BestFit.Tests.csproj

      - name: Build
        run: dotnet build src/RMC.BestFit.Tests/RMC.BestFit.Tests.csproj -c Release --no-restore

      - name: Test
        env:
          VSTEST_CONNECTION_TIMEOUT: '600'
        run: dotnet test src/RMC.BestFit.Tests/RMC.BestFit.Tests.csproj -c Release --no-build